    [build-system]
    requires = ["hatchling"]
    build-backend = "hatchling.build"

    [project]
    name = "deprecated-api"
    version = "0.1.0"
    description = "AI/Data Science project."
    readme = "README.md"
    requires-python = ">=3.12"
    dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
]

[project.optional-dependencies]
experiments = [
    "accelerate",
    "google-genai",
    "torch",
    "transformers",
]

    [dependency-groups]
    dev = [
        "ipykernel",
    "pytest",
    "ruff",
    ]

    [tool.hatch.build.targets.wheel]
    packages = ["deprecated_api"]

    [tool.pytest.ini_options]
    testpaths = ["tests"]

    [tool.ruff]
    line-length = 100
    target-version = "py312"
    # Supplied legacy monolith is retained for provenance, not an active stage.
    extend-exclude = ["notebooks/share-deapi.ipynb"]

    [tool.ruff.lint]
    select = ["E", "F", "I", "UP"]

    [tool.nbflow]
    kernel_name = "deprecated_api"
    kernel_display_name = "Python (deprecated-api)"
    kaggle_include = ["deprecated_api"]
